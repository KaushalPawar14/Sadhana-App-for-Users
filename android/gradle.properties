org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
# Root cause fix (2026-09-09): AGP 8.11.1 requires Java 17; this machine's
# JAVA_HOME/PATH java is 11.0.2 ("Android Gradle plugin requires Java 17 to
# run. You are currently using Java 11" — the real error, only visible when
# Gradle is invoked directly with --stacktrace; Flutter's own wrapper only
# ever surfaced a misleading "Unable to establish loopback connection").
#
# Originally pointed at Android Studio's own bundled JBR (17.0.10), which DID
# fix the Java-version error above but then hit a second, unrelated problem:
# the daemon crashed on its very first accepted socket with
# `java.net.SocketException: Invalid argument: connect` inside
# `sun.nio.ch.WEPollSelectorImpl` — a bug in THAT SPECIFIC JBR build's NIO
# selector on this machine, confirmed via the daemon's own log, not a
# firewall/antivirus block (both were checked and are unrelated) and not
# fixed by a `~/.gradle/caches` clear or by forcing
# `-Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider`
# (confirmed via the log that override never took effect).
#
# Swapped to Microsoft Build of OpenJDK 17.0.20.1 (installed via
# `winget install Microsoft.OpenJDK.17`) — a different vendor's JDK 17 build,
# to rule out this being a defect in JetBrains' specific JBR rather than
# Java 17 generally. Not the system-wide JAVA_HOME, which other tools may
# depend on.
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.20.101-hotspot
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
